# Static site: no build step. Functions live in netlify/functions/.
[build]
  publish = "."

# Node 18+ provides global fetch for serverless functions.
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/realestate.html"
  to = "/search-properties.html"
  status = 301

[[redirects]]
  from = "/blogPost.html"
  to = "/Insights/insight-record-breaking-62m-naples-sale-paul-arpin-202608.html"
  status = 301

# Internal editor tools — not for public site
[[redirects]]
  from = "/insightsCreator.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/instructions.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/articles/*"
  to = "/"
  status = 302
